# Single-package repo. pnpm 10 blocks dependency build scripts by default;
# only the ones we need are allowed.
onlyBuiltDependencies:
  - "@swc/core"
  # Native SQLite binding, used by Drizzle and the LangGraph checkpointer.
  - better-sqlite3
  - esbuild
  - unrs-resolver
ignoredBuiltDependencies:
  # Browsers are installed explicitly via `pnpm exec playwright install chromium`.
  - "@playwright/browser-chromium"
  # promptfoo optional extras we don't use.
  - onnxruntime-node
  - protobufjs
patchedDependencies:
  # Vitest 5 test names for Stryker's per-test runs (DECISIONS TD19).
  "@stryker-mutator/vitest-runner@10.0.0": patches/@stryker-mutator__vitest-runner@10.0.0.patch
